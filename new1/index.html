<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    >
    <meta name="theme-color" content="#1a4d5c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="format-detection" content="telephone=no">

    <title>Wedding Invitation | Rahul &amp; Priya</title>

    <!-- Elegant fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet"
    >

    <style>
        /* ================================
           RESET AND BASE STYLES
        ================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;

            background: #fdfbf7;
            font-family: sans-serif;

            overflow-x: hidden;
            overscroll-behavior-x: none;
            -webkit-overflow-scrolling: touch;
            -webkit-touch-callout: none;
        }

        @supports (overflow: clip) {
            html,
            body {
                overflow-x: clip;
            }
        }

        /* ================================
           DYNAMIC VIEWPORT HEIGHT
        ================================= */

        :root {
            --vh: 1vh;
        }

        /* ================================
           SCROLL CONTAINER
        ================================= */

        .scroll-container {
            position: relative;
            width: 100%;

            height: 200vh;
            height: calc(var(--vh, 1vh) * 200);
            height: 200dvh;

            margin: 0;
            padding: 0;

            background: #fdfbf7;
            z-index: 10;
        }

        /* ================================
           STICKY HERO SECTION
        ================================= */

        .hero-wrapper {
            position: sticky;
            position: -webkit-sticky;

            top: 0;
            left: 0;

            width: 100%;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            height: 100dvh;

            max-width: calc(100vh * (9 / 16));
            max-width: calc(var(--vh, 1vh) * 100 * (9 / 16));
            max-width: calc(100dvh * (9 / 16));

            margin: 0 auto;

            overflow: hidden;

            background: #fff;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.18);

            isolation: isolate;

            /* 3D camera — lower = stronger 3D */
            perspective: 800px;
            perspective-origin: 50% 50%;

            touch-action: pan-y;
        }

        /* ================================
           HERO IMAGE LAYERS
        ================================= */

        .layer {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            transform-origin: 50% 50%;

            will-change: transform;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;

            pointer-events: none;
        }

        .layer img {
            display: block;
            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            user-select: none;
            -webkit-user-select: none;
            -webkit-user-drag: none;
            -webkit-touch-callout: none;
            pointer-events: none;
        }

        /* --- Layer stacking (depth order) --- */

        .bg-layer {
            z-index: 1;
            transform: scale(1.20);
        }

        .petals-layer-back {
            z-index: 2;
            opacity: 0.8;
            transform: scale(1.24);
        }

        .boat-layer {
            z-index: 3;
            transform: translate3d(0, 28vh, 0);
        }

        .boat-layer img {
            object-fit: contain;
            object-position: bottom center;
        }

        .petals-layer-front {
            z-index: 4;
            transform: scale(1.38);
        }

        /* ================================
           TOP SHADE
        ================================= */

        .hero-top-shade {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 300px;
            z-index: 5;

            background: linear-gradient(
                to bottom,
                rgba(18, 14, 12, 0.40),
                rgba(18, 14, 12, 0.16) 45%,
                rgba(18, 14, 12, 0.04) 75%,
                transparent
            );

            pointer-events: none;
        }

        /* ================================
           HERO TEXT GROUP
        ================================= */

        .hero-text {
            position: absolute;
            top: clamp(70px, 14vh, 160px);
            left: 16px;
            right: 16px;

            z-index: 6;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(12px, 2vh, 22px);

            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;

            will-change: transform;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        /* ---- Couple names ---- */

        .hero-names {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            color: #ffffff;

            font-family: "Cormorant Garamond", "Georgia", "Times New Roman", serif;
            font-weight: 500;
            font-size: clamp(46px, 9.5vh, 85px);
            line-height: 1.0;
            letter-spacing: 0.03em;
            text-align: center;

            text-shadow:
                0 0 4px rgba(255, 255, 255, 0.95),
                0 0 12px rgba(255, 255, 255, 0.75),
                0 0 26px rgba(255, 255, 255, 0.55),
                0 0 48px rgba(255, 255, 255, 0.35),
                0 2px 6px rgba(18, 12, 8, 0.35),
                0 4px 20px rgba(18, 12, 8, 0.28);
        }

        .hero-names .name {
            display: block;
        }

        .hero-names .ampersand {
            display: block;
            margin: 0.02em 0 0.04em;

            color: #f6e6bb;
            font-family: "Cormorant Garamond", "Georgia", serif;
            font-style: italic;
            font-weight: 400;
            font-size: 0.62em;
            line-height: 1;

            text-shadow:
                0 0 4px rgba(255, 255, 255, 0.95),
                0 0 12px rgba(255, 255, 255, 0.7),
                0 0 26px rgba(255, 255, 255, 0.5),
                0 0 44px rgba(255, 255, 255, 0.32),
                0 2px 6px rgba(18, 12, 8, 0.35),
                0 4px 18px rgba(18, 12, 8, 0.25);
        }

        /* ---- Divider + date ---- */

        .hero-subtitle {
            display: flex;
            align-items: center;
            gap: clamp(8px, 1.4vw, 14px);

            color: rgba(255, 255, 255, 0.95);

            font-family: "Montserrat", "Helvetica Neue", sans-serif;
            font-weight: 400;
            font-size: clamp(8.5px, 1.55vh, 11px);
            letter-spacing: 0.32em;
            text-transform: uppercase;
            text-align: center;

            text-shadow:
                0 0 6px rgba(255, 255, 255, 0.7),
                0 1px 2px rgba(18, 12, 8, 0.4),
                0 2px 10px rgba(18, 12, 8, 0.25);
        }

        .hero-subtitle .line {
            display: block;
            width: clamp(18px, 4.5vw, 38px);
            height: 1px;

            background: rgba(255, 255, 255, 0.65);
        }

        .hero-subtitle .date-text {
            white-space: nowrap;
        }

        /* ================================
           MOTION HINT (iOS permission)
        ================================= */

        .motion-hint {
            position: absolute;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom));
            z-index: 7;

            padding: 10px 18px;
            border-radius: 999px;

            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.38);

            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);

            color: #ffffff;
            font-family: "Montserrat", "Helvetica Neue", sans-serif;
            font-size: 9.5px;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            white-space: nowrap;

            opacity: 0;
            transform: translateX(-50%) translateY(8px);
            pointer-events: none;

            transition: opacity 0.45s ease, transform 0.45s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .motion-hint.is-visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }

        /* ================================
           SECOND SECTION: WEDDING DETAILS
        ================================= */

        .wedding-details {
            position: relative;
            z-index: 20;

            width: 100%;
            min-height: 100vh;
            min-height: calc(var(--vh, 1vh) * 100);
            min-height: 100dvh;

            padding: 80px 20px;
            padding-left: calc(20px + env(safe-area-inset-left));
            padding-right: calc(20px + env(safe-area-inset-right));
            padding-bottom: calc(80px + env(safe-area-inset-bottom));

            margin: 0;

            background: #fdfbf7;
            color: #333;
            text-align: center;
            font-family: "Georgia", serif;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .wedding-details h2 {
            margin: 0 0 40px;

            font-family: sans-serif;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 3px;
            line-height: 1.6;
            text-transform: uppercase;

            color: #888;
        }

        .parents-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;

            width: 100%;
            max-width: 800px;
        }

        .person {
            display: flex;
            flex: 1;
            flex-direction: column;
            align-items: center;
        }

        .person h3 {
            margin: 0 0 15px;

            color: #2c3e50;
            font-size: 2rem;
            font-weight: 400;
            line-height: 1.3;
        }

        .person p {
            margin: 0;

            color: #666;
            font-family: sans-serif;
            font-size: 1rem;
            line-height: 1.8;
        }

        .wedding-details .ampersand {
            margin: 10px 0;

            color: #d4af37;
            font-family: "Georgia", serif;
            font-size: 3rem;
            font-style: italic;
        }

        .wedding-date {
            width: 60%;
            max-width: 300px;

            margin-top: 60px;
            padding-top: 20px;

            border-top: 1px solid #e0e0e0;

            color: #888;
            font-family: sans-serif;
            font-size: 0.9rem;
            letter-spacing: 2px;
            line-height: 1.8;
        }

        /* ================================
           TABLET AND DESKTOP
        ================================= */

        @media (min-width: 768px) {
            .parents-container {
                flex-direction: row;
                justify-content: center;
                align-items: flex-start;
                gap: 50px;
            }

            .wedding-details .ampersand {
                flex-shrink: 0;
                margin: 15px 10px 0;
                font-size: 3.5rem;
            }
        }

        /* ================================
           SMALL MOBILE SCREENS
        ================================= */

        @media (max-width: 380px) {
            .hero-text {
                top: clamp(56px, 11vh, 120px);
                gap: 10px;
            }

            .hero-names {
                font-size: clamp(40px, 8vh, 64px);
                letter-spacing: 0.02em;
            }

            .hero-subtitle {
                font-size: 7.5px;
                letter-spacing: 0.26em;
            }

            .hero-subtitle .line {
                width: 16px;
            }

            .motion-hint {
                font-size: 8.5px;
                padding: 8px 14px;
            }

            .wedding-details {
                padding: 60px 18px;
                padding-bottom: calc(60px + env(safe-area-inset-bottom));
            }

            .wedding-details h2 {
                font-size: 0.85rem;
                letter-spacing: 2px;
            }

            .person h3 {
                font-size: 1.8rem;
            }
        }

        /* ================================
           REDUCED MOTION
        ================================= */

        @media (prefers-reduced-motion: reduce) {
            .layer,
            .hero-text {
                will-change: auto;
            }

            .scroll-container {
                height: 100vh;
                height: calc(var(--vh, 1vh) * 100);
                height: 100dvh;
            }

            .motion-hint {
                display: none;
            }
        }

        @media (update: slow) {
            .layer,
            .hero-text {
                will-change: auto;
            }
        }
    </style>
</head>

<body>

    <!-- =================================
         HERO SCROLL CONTAINER
    ================================== -->

    <section class="scroll-container" id="hero-scroll">

        <!-- Sticky hero (clipped) -->
        <div class="hero-wrapper" id="hero">

            <!-- Layer 1: Pond Background -->
            <div class="layer bg-layer" id="layer-bg">
                <img
                    src="assets/pondbg.png"
                    alt="Romantic pond background"
                    fetchpriority="high"
                    decoding="async"
                >
            </div>

            <!-- Layer 2: Floating Petals (Back) -->
            <div class="layer petals-layer-back" id="layer-petals-back">
                <img
                    src="assets/petalsimg.png"
                    alt=""
                    decoding="async"
                >
            </div>

            <!-- Layer 3: Boat with Couple -->
            <div class="layer boat-layer" id="layer-boat">
                <img
                    src="assets/boatcouple.png"
                    alt="Bride and groom sitting in a boat"
                    decoding="async"
                >
            </div>

            <!-- Layer 4: Floating Petals (Front) -->
            <div class="layer petals-layer-front" id="layer-petals-front">
                <img
                    src="assets/petalsimg.png"
                    alt="Floating flower petals"
                    decoding="async"
                >
            </div>

            <!-- Top gradient for text readability -->
            <div class="hero-top-shade" aria-hidden="true"></div>

            <!-- Hero text -->
            <div class="hero-text" id="hero-text">
                <h1 class="hero-names" aria-label="Rahul and Priya">
                    <span class="name">Rahul</span>
                    <span class="ampersand">&amp;</span>
                    <span class="name">Priya</span>
                </h1>

                <div class="hero-subtitle">
                    <span class="line" aria-hidden="true"></span>
                    <span class="date-text">Save the Date · 14 February 2026</span>
                    <span class="line" aria-hidden="true"></span>
                </div>
            </div>

            <!-- iOS motion permission hint -->
            <div class="motion-hint" id="motion-hint" role="button" tabindex="0">
                Tap for 3D motion
            </div>

        </div>
    </section>

    <!-- =================================
         SECOND SECTION
    ================================== -->

    <section class="wedding-details" id="wedding-details">

        <h2>Together with their parents</h2>

        <div class="parents-container">

            <div class="person">
                <h3>Rahul</h3>
                <p>
                    Son of<br>
                    Mr. &amp; Mrs. Sharma
                </p>
            </div>

            <div class="ampersand">&amp;</div>

            <div class="person">
                <h3>Priya</h3>
                <p>
                    Daughter of<br>
                    Mr. &amp; Mrs. Patel
                </p>
            </div>

        </div>

        <div class="wedding-date">
            SAVE THE DATE • 14 FEBRUARY 2026
        </div>

    </section>

    <script>
    (function () {
        "use strict";

        /* =========================================================
           TUNING
           ---------------------------------------------------------
           GYRO_SENSITIVITY : degrees of tilt for ~76% response
                              (lower = more sensitive)
           GYRO_INVERT      : true  = "look through a window"
                              false = "objects follow the phone"
           IDLE_AMPLITUDE   : gentle auto-drift when there is no
                              input at all (0 disables it)
           IDLE_DELAY       : seconds of no input before the drift
                              starts
        ========================================================= */

        var GYRO_SENSITIVITY = 9;
        var GYRO_INVERT      = true;
        var IDLE_AMPLITUDE   = 0.30;
        var IDLE_DELAY       = 2.5;

        /* =========================================================
           HELPERS
        ========================================================= */

        var root = document.documentElement;

        function clamp(v, min, max) {
            return v < min ? min : (v > max ? max : v);
        }

        function nowMs() {
            return (typeof performance !== "undefined" && performance.now)
                ? performance.now()
                : Date.now();
        }

        /* =========================================================
           VIEWPORT HEIGHT FIX (iOS address-bar)
        ========================================================= */

        function setViewportHeight() {
            var h = (window.visualViewport && window.visualViewport.height)
                  || window.innerHeight
                  || 0;

            if (h > 0) {
                root.style.setProperty("--vh", (h * 0.01) + "px");
            }
        }

        setViewportHeight();

        window.addEventListener("resize", setViewportHeight, { passive: true });
        window.addEventListener("orientationchange", function () {
            setTimeout(setViewportHeight, 100);
            setTimeout(setViewportHeight, 300);
        }, { passive: true });

        if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", setViewportHeight, { passive: true });
            window.visualViewport.addEventListener("scroll", setViewportHeight, { passive: true });
        }

        /* =========================================================
           ELEMENT REFERENCES
        ========================================================= */

        var heroScroll  = document.getElementById("hero-scroll");
        var heroWrapper = document.getElementById("hero");
        var heroText    = document.getElementById("hero-text");

        var bgLayer     = document.getElementById("layer-bg");
        var petalsBack  = document.getElementById("layer-petals-back");
        var petalsFront = document.getElementById("layer-petals-front");
        var boatLayer   = document.getElementById("layer-boat");

        var motionHint  = document.getElementById("motion-hint");

        var prefersReducedMotion = window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches;

        /* =========================================================
           SPRING PHYSICS
        ========================================================= */

        function springStep(state, target, dt, omega, zeta) {
            var f    = 1 + 2 * dt * zeta * omega;
            var oo   = omega * omega;
            var hoo  = dt * oo;
            var hhoo = dt * hoo;
            var inv  = 1 / (f + hhoo);

            var newValue =
                (f * state.value + dt * state.velocity + hhoo * target) * inv;

            var newVelocity =
                (state.velocity + hoo * (target - state.value)) * inv;

            state.value    = newValue;
            state.velocity = newVelocity;
        }

        /* =========================================================
           STATE
        ========================================================= */

        var camXSpring = { value: 0, velocity: 0, omega: 15, zeta: 0.85 };
        var camYSpring = { value: 0, velocity: 0, omega: 15, zeta: 0.85 };

        var progressSpring = { value: 0, velocity: 0, omega: 9.5, zeta: 0.85 };

        var targetProgress = 0;

        var gyroX = 0;
        var gyroY = 0;

        var pointerX = 0;
        var pointerY = 0;

        var gyroAvailable = false;
        var lastInputTime = nowMs();

        /* =========================================================
           SCROLL PROGRESS
        ========================================================= */

        function updateTargetProgress() {
            var scrollDistance =
                heroScroll.offsetHeight - heroWrapper.offsetHeight;

            if (scrollDistance <= 0) {
                targetProgress = 1;
                return;
            }

            var rect = heroScroll.getBoundingClientRect();
            var distanceScrolled = -rect.top;

            targetProgress = clamp(distanceScrolled / scrollDistance, 0, 1);
        }

        window.addEventListener("scroll", updateTargetProgress, { passive: true });
        window.addEventListener("resize", updateTargetProgress, { passive: true });
        window.addEventListener("orientationchange", function () {
            setTimeout(updateTargetProgress, 100);
            setTimeout(updateTargetProgress, 300);
        }, { passive: true });

        if (window.visualViewport) {
            window.visualViewport.addEventListener("scroll", updateTargetProgress, { passive: true });
        }

        updateTargetProgress();

        /* =========================================================
           POINTER INPUT (mouse + touch fallback)
        ========================================================= */

        function handlePointer(clientX, clientY) {
            if (gyroAvailable) return; // gyro takes priority

            pointerX = clamp((clientX / window.innerWidth) * 2 - 1, -1, 1);
            pointerY = clamp((clientY / window.innerHeight) * 2 - 1, -1, 1);

            lastInputTime = nowMs();
        }

        if (!prefersReducedMotion) {

            window.addEventListener("mousemove", function (e) {
                handlePointer(e.clientX, e.clientY);
            }, { passive: true });

            window.addEventListener("touchstart", function (e) {
                if (e.touches && e.touches.length) {
                    handlePointer(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener("touchmove", function (e) {
                if (e.touches && e.touches.length) {
                    handlePointer(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            window.addEventListener("touchend", function () {
                if (gyroAvailable) return;
                pointerX = 0;
                pointerY = 0;
                lastInputTime = nowMs();
            }, { passive: true });

            window.addEventListener("mouseleave", function () {
                if (gyroAvailable) return;
                pointerX = 0;
                pointerY = 0;
            });
        }

        /* =========================================================
           GYROSCOPE
        ========================================================= */

        var gyroCalib      = [];
        var gyroNeutral    = null;
        var CALIB_SAMPLES  = 10;
        var gyroAttached   = false;

        function shortestDelta(a, b) {
            var d = a - b;
            while (d > 180) d -= 360;
            while (d < -180) d += 360;
            return d;
        }

        function handleOrientation(event) {
            var beta  = event.beta;
            var gamma = event.gamma;

            if (typeof beta !== "number" || typeof gamma !== "number") return;
            if (!isFinite(beta) || !isFinite(gamma)) return;

            lastInputTime = nowMs();

            /* ---- Learn the neutral holding pose ---- */
            if (!gyroNeutral) {
                gyroCalib.push(beta, gamma);

                if (gyroCalib.length >= CALIB_SAMPLES * 2) {
                    var sb = 0;
                    var sg = 0;

                    for (var i = 0; i < gyroCalib.length; i += 2) {
                        sb += gyroCalib[i];
                        sg += gyroCalib[i + 1];
                    }

                    gyroNeutral = {
                        beta:  sb / CALIB_SAMPLES,
                        gamma: sg / CALIB_SAMPLES
                    };

                    gyroAvailable = true;
                    hideHint();
                }
                return;
            }

            /* ---- Tilt relative to neutral ---- */
            var dB = shortestDelta(beta, gyroNeutral.beta);
            var dG = shortestDelta(gamma, gyroNeutral.gamma);

            var nx = Math.tanh(dG / GYRO_SENSITIVITY);
            var ny = Math.tanh(dB / GYRO_SENSITIVITY);

            if (GYRO_INVERT) {
                nx = -nx;
                ny = -ny;
            }

            gyroX = nx;
            gyroY = ny;
            gyroAvailable = true;
        }

        function attachGyro() {
            if (gyroAttached) return;
            gyroAttached = true;
            window.addEventListener(
                "deviceorientation",
                handleOrientation,
                { passive: true }
            );
        }

        /* =========================================================
           HINT UI + PERMISSION
        ========================================================= */

        function hideHint() {
            if (motionHint) {
                motionHint.classList.remove("is-visible");
            }
        }

        function showHint() {
            if (motionHint) {
                motionHint.classList.add("is-visible");
            }
        }

        var firstGesture = null;

        function requestGyro() {
            if (firstGesture) {
                window.removeEventListener("touchend", firstGesture);
                window.removeEventListener("click", firstGesture);
                firstGesture = null;
            }

            if (typeof DeviceOrientationEvent === "undefined") {
                hideHint();
                return;
            }

            if (typeof DeviceOrientationEvent.requestPermission === "function") {
                DeviceOrientationEvent.requestPermission()
                    .then(function (state) {
                        if (state === "granted") attachGyro();
                        hideHint();
                    })
                    .catch(function () {
                        hideHint();
                    });
            } else {
                attachGyro();
                hideHint();
            }
        }

        if (!prefersReducedMotion && typeof DeviceOrientationEvent !== "undefined") {

            var needsPermission =
                (typeof DeviceOrientationEvent.requestPermission === "function");

            if (needsPermission) {
                /* iOS 13+ — show a hint and request on first tap */
                setTimeout(showHint, 900);

                firstGesture = function () {
                    requestGyro();
                };

                window.addEventListener("touchend", firstGesture, { passive: true });
                window.addEventListener("click", firstGesture);

                if (motionHint) {
                    motionHint.addEventListener("click", function (e) {
                        e.stopPropagation();
                        requestGyro();
                    });

                    motionHint.addEventListener("touchend", function (e) {
                        e.stopPropagation();
                    }, { passive: true });
                }

            } else {
                /* Android / desktop — no permission needed */
                attachGyro();
            }
        }

        /* =========================================================
           REDUCED MOTION: STATIC LAYOUT
        ========================================================= */

        if (prefersReducedMotion) {
            bgLayer.style.transform     = "scale(1.20)";
            petalsBack.style.transform  = "scale(1.24)";
            petalsFront.style.transform = "scale(1.38)";
            boatLayer.style.transform   = "translate3d(0, 0, 0)";
            heroText.style.transform    = "translate3d(0, 0, 0)";
        }

        /* =========================================================
           RENDER HELPERS
        ========================================================= */

        function yCalc(pxVal, vhVal) {
            var sign = vhVal < 0 ? " - " : " + ";
            return "calc(" +
                pxVal.toFixed(2) + "px" +
                sign +
                Math.abs(vhVal).toFixed(3) + "vh)";
        }

        function setLayer(el, tx, ty, px, py, ry, rx, scale, vh) {
            el.style.transform =
                "translate3d(" +
                    (tx * px).toFixed(2) + "px, " +
                    yCalc(ty * py, vh) + ", 0) " +
                "rotateY(" + (tx * ry).toFixed(3) + "deg) " +
                "rotateX(" + (-ty * rx).toFixed(3) + "deg) " +
                "scale(" + scale + ")";
        }

        /* =========================================================
           ANIMATION LOOP
        ========================================================= */

        var lastTime = 0;

        function animate(time) {
            requestAnimationFrame(animate);

            if (prefersReducedMotion) return;

            if (!lastTime) {
                lastTime = time;
                return;
            }

            var dt = (time - lastTime) / 1000;
            lastTime = time;

            if (dt > 1 / 30) dt = 1 / 30;
            if (dt <= 0)     dt = 1 / 60;

            /* ---- Decide which input drives the camera ---- */

            var sinceInput = (time - lastInputTime) / 1000;
            var tx;
            var ty;

            if (gyroAvailable) {
                tx = gyroX;
                ty = gyroY;
            } else {
                tx = pointerX;
                ty = pointerY;
            }

            /* ---- Gentle auto-drift when nobody is interacting ---- */

            if (IDLE_AMPLITUDE > 0 && sinceInput > IDLE_DELAY) {
                var ramp = Math.min(1, (sinceInput - IDLE_DELAY) / 2.5);
                var amp  = IDLE_AMPLITUDE * ramp;

                tx += Math.sin(time * 0.00055) * amp;
                ty += Math.cos(time * 0.00042) * amp * 0.7;
            }

            tx = clamp(tx, -1.15, 1.15);
            ty = clamp(ty, -1.15, 1.15);

            /* ---- Advance springs ---- */

            springStep(camXSpring, tx, dt, camXSpring.omega, camXSpring.zeta);
            springStep(camYSpring, ty, dt, camYSpring.omega, camYSpring.zeta);
            springStep(progressSpring, targetProgress, dt,
                       progressSpring.omega, progressSpring.zeta);

            var cx = camXSpring.value;
            var cy = camYSpring.value;
            var p  = progressSpring.value;

            /* ---- Background (deepest) ---- */

            setLayer(
                bgLayer,
                cx, cy,
                8, 6,
                2.0, 1.5,
                1.20,
                p * -1.5
            );

            /* ---- Petals back ---- */

            setLayer(
                petalsBack,
                cx, cy,
                18, 13,
                4.5, 3.0,
                1.24,
                p * -5
            );

            /* ---- Petals front ---- */

            setLayer(
                petalsFront,
                cx, cy,
                32, 22,
                8.0, 5.0,
                1.38,
                p * -9
            );

            /* ---- Boat (closest) ---- */

            var boatVh = (1 - p) * 24 + 4;

            boatLayer.style.transform =
                "translate3d(" +
                    (cx * 48).toFixed(2) + "px, " +
                    yCalc(cy * 34, boatVh) + ", 0) " +
                "rotateY(" + (cx * 10).toFixed(3) + "deg) " +
                "rotateX(" + (-cy * 6).toFixed(3) + "deg)";

            /* ---- Text ---- */

            heroText.style.transform =
                "translate3d(" +
                    (cx * 6).toFixed(2) + "px, " +
                    yCalc(cy * 4, p * 10) + ", 0)";
        }

        requestAnimationFrame(animate);

    })();
    </script>

</body>
